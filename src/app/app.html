@if (isKioskRoute()) {
  <!-- Kiosk routes: full-screen, no nav chrome, no shell padding -->
  <router-outlet />
  <app-toast-container />
} @else {
  <div class="flex flex-col min-h-screen md:flex-row md:h-screen md:overflow-hidden">
    <app-navigation />
    <main class="flex-1 overflow-auto bg-gray-100 dark:bg-gray-900 pb-16 md:pb-0">
      <router-outlet />
    </main>
    <app-toast-container />
    <app-session-expiry-warning />
  </div>
}
