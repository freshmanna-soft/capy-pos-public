<!-- Fixed and above the app nav: this is a mode, not a panel. -->
<div
  class="fixed inset-0 z-[60] flex flex-col overflow-hidden bg-onsen-deep text-steam"
  data-testid="self-checkout-shell"
>
  <header class="flex items-center justify-between px-6 py-5 md:px-10">
    <p class="font-data text-[10px] uppercase tracking-[0.22em] text-kelp">Capy-POS</p>
    <div class="flex flex-wrap items-center justify-end gap-2">
      @if (currentCustomer.isAuthenticated()) {
        <span
          class="max-w-48 truncate text-xs text-kelp"
          data-testid="self-checkout-customer-email"
        >
          {{ currentCustomer.email() }}
        </span>
        <button
          type="button"
          (click)="signOut()"
          class="rounded-full border border-kelp/30 px-3 py-2 font-data text-[10px] uppercase tracking-[0.16em] text-kelp transition-colors hover:border-kelp focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="self-checkout-signout"
        >
          Sign out
        </button>
      } @else {
        <!-- Account actions are offers, never a gate: anonymous checkout remains supported. -->
        <button
          type="button"
          (click)="goToSignIn()"
          class="rounded-full border border-kelp/30 px-3 py-2 font-data text-[10px] uppercase tracking-[0.16em] text-kelp transition-colors hover:border-kelp focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="self-checkout-signin-link"
        >
          Sign in
        </button>
        <button
          type="button"
          (click)="goToSignUp()"
          class="rounded-full border border-kelp/30 px-3 py-2 font-data text-[10px] uppercase tracking-[0.16em] text-kelp transition-colors hover:border-kelp focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="self-checkout-signup-link"
        >
          Create an account
        </button>
      }
      <button
        type="button"
        (click)="exit()"
        class="rounded-full border border-kelp/30 bg-onsen-water/40 px-3 py-2 font-data text-[10px] uppercase tracking-[0.16em] text-kelp backdrop-blur transition-colors hover:border-kelp focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
        data-testid="self-checkout-exit"
      >
        Back to till
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto px-6 pb-10">
    <app-self-checkout-scan />
  </main>
</div>
