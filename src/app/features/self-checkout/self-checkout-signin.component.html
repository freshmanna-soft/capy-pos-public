<div
  class="fixed inset-0 z-[60] flex flex-col overflow-y-auto bg-onsen-deep text-steam"
  data-testid="self-checkout-signin"
>
  <header class="flex items-center justify-between px-6 py-5 md:px-10">
    <p class="font-data text-[10px] uppercase tracking-[0.22em] text-kelp">Capy-POS</p>
    <button
      type="button"
      (click)="continueWithoutAccount()"
      class="rounded-full border border-kelp/30 bg-onsen-water/40 px-3 py-2 font-data text-[10px] uppercase tracking-[0.16em] text-kelp backdrop-blur transition-colors hover:border-kelp focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
      data-testid="signin-back-to-lane"
    >
      Back to checkout
    </button>
  </header>

  <main class="mx-auto w-full max-w-md flex-1 px-6 pb-12">
    <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
    <p class="mt-2 text-sm text-kelp">
      Welcome back. Signing in is optional — you can scan and pay without an account.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5" novalidate>
      <div>
        <label
          for="signin-email"
          class="font-data text-[10px] uppercase tracking-[0.16em] text-kelp"
          >Email</label
        >
        <input
          id="signin-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          aria-required="true"
          [attr.aria-invalid]="fieldInvalid('email') ? 'true' : null"
          [attr.aria-describedby]="describedBy('email')"
          [class.border-tsuba]="fieldInvalid('email')"
          class="mt-2 w-full rounded-xl border border-onsen-surface/60 bg-onsen-water/40 px-4 py-3 text-steam placeholder:text-kelp/60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="signin-email"
        />
        @if (emailError(); as problem) {
          <p id="signin-email-error" role="alert" class="mt-2 text-sm text-tsuba">
            {{ problem }}
          </p>
        }
      </div>

      <div>
        <label
          for="signin-password"
          class="font-data text-[10px] uppercase tracking-[0.16em] text-kelp"
          >Password</label
        >
        <input
          id="signin-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          aria-required="true"
          [attr.aria-invalid]="fieldInvalid('password') ? 'true' : null"
          [attr.aria-describedby]="describedBy('password')"
          [class.border-tsuba]="fieldInvalid('password')"
          class="mt-2 w-full rounded-xl border border-onsen-surface/60 bg-onsen-water/40 px-4 py-3 text-steam placeholder:text-kelp/60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="signin-password"
        />
        @if (passwordError(); as problem) {
          <p id="signin-password-error" role="alert" class="mt-2 text-sm text-tsuba">
            {{ problem }}
          </p>
        }
      </div>

      @if (refusal(); as problem) {
        <div
          id="signin-refusal"
          role="alert"
          class="rounded-xl border border-tsuba/50 bg-tsuba/10 px-4 py-3 text-sm text-steam"
          data-testid="signin-error"
        >
          <p>{{ problem.message }}</p>
        </div>
      }

      <div class="flex flex-col gap-3 pt-2 sm:flex-row">
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex-1 rounded-xl bg-yuzu px-4 py-3 font-semibold text-onsen-deep transition-opacity disabled:opacity-60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="signin-submit"
        >
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </button>
        <button
          type="button"
          (click)="continueWithoutAccount()"
          class="flex-1 rounded-xl border border-yuzu/60 px-4 py-3 font-semibold text-yuzu focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yuzu"
          data-testid="signin-continue-anonymous"
        >
          Continue without an account
        </button>
      </div>
    </form>
  </main>
</div>
